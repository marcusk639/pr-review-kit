name: pr-review-kit propose
description: >-
  Model-free: opens or updates the one learning PR from the learn action's
  artifact. Run in a separate job with contents: write and pull-requests: write,
  after the learn job, with the default branch checked out (persist-credentials
  false). Writes only under .pr-review/ and never overwrites a learning
  branch a maintainer has edited.
inputs:
  dry_run:
    description: "true: print the plan instead of writing."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Default branch only
      shell: bash
      env:
        REF: ${{ github.ref }}
        DEFAULT: ${{ github.event.repository.default_branch }}
      run: |
        if [ -z "$DEFAULT" ] || [ "$REF" != "refs/heads/$DEFAULT" ]; then echo "::error::pr-review learning runs only on the default branch"; exit 1; fi

    - name: Download proposal
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: pr-review-learning
        path: ${{ runner.temp }}/pr-review-bundle

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"

    - name: Propose
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BUNDLE: ${{ runner.temp }}/pr-review-bundle
        PR_REVIEW_DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
        NODE_OPTIONS: ""
        BASH_ENV: ""
      run: node --no-warnings "${{ github.action_path }}/../../engine/learn/propose.mjs"
