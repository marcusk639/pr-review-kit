name: pr-review-kit publish
description: >-
  Model-free publish: inline comments, the private security channel and the
  one summary comment. Runs this action's pinned engine with the project
  config from a fresh checkout of the review's trust SHA. The only step that
  sees the id key and the private-channel tokens. Use with if: always() after
  the review action.
inputs:
  trust_sha:
    description: The review action's trust_sha output (falls back to the PR base SHA).
    required: false
    default: 
  action_outcome:
    description: The review action's outcome output.
    required: false
    default: ""
  execution_file:
    description: The review action's execution_file output.
    required: false
    default: ""
  id_key:
    description: PR_REVIEW_ID_KEY (HMAC key for opaque ledger ids). Public repos.
    required: false
    default: ""
  advisory_token:
    description: securityChannel advisory (public repos). Fine-grained PAT, "Repository security advisories - read and write" on this repo only.
    required: false
    default: ""
  private_repo:
    description: securityChannel private-repo-issue. The Marcus-only inbox repo, owner/name, from a repository variable (never committed).
    required: false
    default: ""
  private_issue_token:
    description: securityChannel private-repo-issue. Fine-grained PAT with Issues read/write on the inbox repo only.
    required: false
    default: ""
  redact_terms:
    description: Optional secret, newline-separated literals removed from everything posted.
    required: false
    default: ""
  dry_run:
    description: "true: print what would be posted instead of posting."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # Fresh every time: whatever exists at this path now (a planted .git, a
    # symlink) must not be reused by the secret-bearing publish step.
    - name: Clear publish checkout path
      shell: bash
      run: rm -rf .review-publish

    - name: Checkout trust SHA (project config, untouched by the model)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ inputs.trust_sha || github.event.pull_request.base.sha }}
        path: .review-publish
        fetch-depth: 1
        persist-credentials: false

    - name: Publish
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ inputs.trust_sha || github.event.pull_request.base.sha }}
        ACTION_OUTCOME: ${{ inputs.action_outcome }}
        EXECUTION_FILE: ${{ inputs.execution_file }}
        PR_REVIEW_PUBLISH: .review-publish
        PR_REVIEW_DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
        # Publish only: keys the ledger's opaque ids. Never given to facts or the model.
        PR_REVIEW_ID_KEY: ${{ inputs.id_key }}
        # Publish only: the private channel. Never given to the model or comments.
        ADVISORY_TOKEN: ${{ inputs.advisory_token }}
        PR_REVIEW_PRIVATE_REPO: ${{ inputs.private_repo }}
        PRIVATE_ISSUE_TOKEN: ${{ inputs.private_issue_token }}
        PR_REVIEW_REDACT_TERMS: ${{ inputs.redact_terms }}
        # Step env overrides GITHUB_ENV: nothing an earlier step exported can
        # preload code into this secret-bearing node process (NODE_OPTIONS)
        # or into the bash shell that launches it (BASH_ENV).
        NODE_OPTIONS: ""
        BASH_ENV: ""
      run: node --no-warnings "${{ github.action_path }}/../../engine/run-publish.mjs"

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        chmod -R u+w "${{ runner.temp }}/prstate-snapshot" 2>/dev/null || true
        rm -rf "${{ runner.temp }}/pr-review" "${{ runner.temp }}/prstate-snapshot"
